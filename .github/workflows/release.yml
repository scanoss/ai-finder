name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync --all-packages --all-extras

      - name: Run tests
        run: uv run pytest --cov=packages/ --cov-report=xml

      - name: Run linting
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Run type checking
        run: uv run mypy packages/
        continue-on-error: true

  build:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Install build dependencies
        run: |
          uv pip install --system build
          # create_seed_db.py (below) imports ai_finder_kb, whose __init__ pulls
          # in sync -> requests, so the package's runtime deps must be present.
          # The script reads the source tree via sys.path rather than this
          # installed copy, so it still sees the telemetry key injected later.
          uv pip install --system ./packages/ai-finder

      - name: Inject telemetry ingest key
        env:
          TELEMETRY_INGEST_KEY: ${{ secrets.TELEMETRY_INGEST_KEY }}
        run: |
          if [ -z "$TELEMETRY_INGEST_KEY" ]; then
            echo "::error::TELEMETRY_INGEST_KEY secret is not set"
            exit 1
          fi
          # Line-anchored substitution: rewrite only the `_INGEST_KEY = "..."`
          # assignment, leaving the `_INGEST_KEY_PLACEHOLDER = "..."` sentinel
          # used by _get_client() intact. v0.3.4 used a global sed that
          # clobbered both, which silently disabled telemetry in the wheel.
          python3 - <<'PY'
          import os, pathlib, sys
          key = os.environ["TELEMETRY_INGEST_KEY"]
          path = pathlib.Path("packages/ai-finder/src/ai_finder_cli/telemetry.py")
          src = path.read_text()
          marker = '_INGEST_KEY = "__TELEMETRY_INGEST_KEY__"'
          if marker not in src:
              sys.exit("::error::assignment marker not found in telemetry.py")
          new = src.replace(marker, f'_INGEST_KEY = "{key}"', 1)
          path.write_text(new)

          # Reload and verify the wheel will be live, not silently disabled.
          sys.path.insert(0, "packages/ai-finder/src")
          from ai_finder_cli import telemetry
          assert telemetry._INGEST_KEY != telemetry._INGEST_KEY_PLACEHOLDER, "key was not substituted"
          assert telemetry._INGEST_KEY_PLACEHOLDER == "__TELEMETRY_INGEST_KEY__", "placeholder constant was clobbered"
          PY

      # seed.db is generated, not committed: ~25 MB of undeltifiable binary
      # regenerated on every seed sync, and a committed copy silently drifts from
      # the seed JSONs. It must exist before the build so hatchling's `artifacts`
      # entry can pull it into the wheel.
      - name: Build seed database
        run: |
          set -euo pipefail
          python scripts/update_seed_checksums.py --verify
          python scripts/create_seed_db.py
          # Counts are derived from the seed JSONs, never hardcoded, so they cannot
          # drift as the corpus grows. --write-counts saves them for the wheel
          # check below, where the JSONs are deliberately no longer present.
          python scripts/verify_seed_db.py --write-counts dist-seed-counts.json

      - name: Build package
        run: |
          cd packages/ai-finder && python -m build && cd ../..
          mkdir -p dist
          cp packages/ai-finder/dist/* dist/

      # The seed JSONs are the source of record in git; seed.db is the artifact
      # shipped in the wheel. They never travel together, so this is the only place
      # the two are checked against each other. A wheel with a missing, empty or
      # truncated seed.db installs and runs perfectly happily and simply fails to
      # identify anything, which is exactly the silent regression worth failing a
      # release over.
      - name: Verify the wheel ships a correctly seeded database
        run: |
          set -euo pipefail
          wheel=$(ls dist/*.whl)
          echo "Inspecting $wheel"

          # 1. seed.db must be present.
          if ! python -m zipfile -l "$wheel" | grep -q 'ai_finder_kb/data/seed.db'; then
            echo "::error::seed.db is missing from the wheel"
            python -m zipfile -l "$wheel" | grep ai_finder_kb || true
            exit 1
          fi

          # 2. The seed JSONs must NOT be present. They are ~33 MB of data already
          #    inside seed.db, and shipping both doubles the install for nothing.
          if python -m zipfile -l "$wheel" | grep -E 'ai_finder_kb/seed/.*\.json'; then
            echo "::error::the wheel ships seed JSONs; only seed.db belongs in it"
            exit 1
          fi

          # 3. Install it and verify the database that a real user would get,
          #    against the counts recorded before packaging.
          python -m venv /tmp/wheelcheck
          /tmp/wheelcheck/bin/python -m pip install --quiet "$wheel"
          installed=$(/tmp/wheelcheck/bin/python -c "import ai_finder_kb, pathlib; print(pathlib.Path(ai_finder_kb.__file__).parent / 'data/seed.db')")
          python scripts/verify_seed_db.py --db "$installed" --expect-counts dist-seed-counts.json

          # 4. The installed CLI must resolve a real hash out of that database,
          #    which is the behaviour all of the above exists to protect.
          /tmp/wheelcheck/bin/python - <<'PY'
          import pathlib, sqlite3, sys
          import ai_finder_kb
          from ai_finder_scanner.enrichment import KBEnricher

          db = pathlib.Path(ai_finder_kb.__file__).parent / "data/seed.db"
          con = sqlite3.connect(f"file:{db}?mode=ro", uri=True)
          row = con.execute(
              "SELECT hex(f.h), m.purl FROM model_files f "
              "JOIN models m ON m.id = f.model_id LIMIT 1"
          ).fetchone()
          con.close()
          if not row:
              sys.exit("::error::installed seed.db has no joinable model_files row")
          digest, want = row
          with KBEnricher(db_path=db, enable_live_fallback=False) as e:
              got = e.lookup_model_by_hash(digest.lower())
          if got is None or got.purl != want:
              sys.exit(f"::error::hash lookup failed in the installed wheel: {got} != {want}")
          print(f"installed wheel resolves {digest[:16].lower()}... -> {want}")
          PY

      - name: Generate hashes
        id: hash
        run: |
          cd dist
          echo "hashes=$(sha256sum * | base64 -w0)" >> $GITHUB_OUTPUT

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: python-packages
          path: dist/
          if-no-files-found: error

  provenance:
    needs: build
    # Skip provenance on private repos (transparency log exposes repo name)
    if: github.event.repository.visibility == 'public'
    permissions:
      actions: read
      id-token: write
      contents: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: ${{ needs.build.outputs.hashes }}
      upload-assets: true

  publish-testpypi:
    needs: build
    # Don't wait for provenance on private repos
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: python-packages
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  publish-github:
    needs: build
    # Don't wait for provenance on private repos
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Python packages
        uses: actions/download-artifact@v8
        with:
          name: python-packages
          path: dist/

      - name: Download provenance
        uses: actions/download-artifact@v8
        with:
          pattern: "*.intoto.jsonl"
          path: provenance/
          merge-multiple: true
        continue-on-error: true

      - name: Create checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*
            provenance/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sign-packages:
    needs: publish-testpypi
    if: always() && needs.publish-testpypi.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      id-token: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: python-packages
          path: dist/

      - name: Sign with Sigstore
        uses: sigstore/gh-action-sigstore-python@v3.4.0
        with:
          inputs: dist/*.tar.gz dist/*.whl
          upload-signing-artifacts: true
