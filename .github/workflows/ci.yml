name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
      - name: Set up Python
        run: uv python install 3.11
      - name: Install dependencies
        run: uv sync --locked --all-packages
      - name: Lint with ruff
        run: uv run ruff check .
      - name: Format check
        run: uv run ruff format --check .

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
      - name: Set up Python
        run: uv python install 3.11
      - name: Install dependencies
        run: uv sync --locked --all-packages
      - name: Type check
        run: uv run mypy packages/ --ignore-missing-imports

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --locked --python ${{ matrix.python-version }} --all-packages --all-extras
      - name: Run tests with coverage
        run: uv run --python ${{ matrix.python-version }} pytest --cov=packages/ --cov-report=xml
        # TODO: Re-enable --cov-fail-under=80 after Phase 2 (KB library)
      - name: Upload coverage
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@v7
        with:
          files: coverage.xml
          fail_ci_if_error: false

  # Proves the seed JSONs, version.json and seed.db cannot drift apart. Runs with
  # no secrets, so it gates the seed-sync PRs opened from the signature corpus the
  # same way it gates a hand edit.
  seed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
      - name: Set up Python
        run: uv python install 3.11
      # create_seed_db.py imports ai_finder_kb, whose __init__ pulls in sync ->
      # requests, so the package's runtime deps have to be present.
      - name: Install dependencies
        run: uv sync --locked --all-packages
      - name: Verify version.json matches the seed files
        run: uv run python scripts/update_seed_checksums.py --verify
      - name: Rebuild seed.db from the seed JSONs
        run: uv run python scripts/create_seed_db.py
      - name: Check the rebuilt database
        run: |
          set -euo pipefail
          uv run python - <<'PY'
          import sqlite3, sys
          db = sqlite3.connect("packages/ai-finder/src/ai_finder_kb/data/seed.db")
          models = db.execute("SELECT COUNT(*) FROM models").fetchone()[0]
          files = db.execute("SELECT COUNT(*) FROM model_files").fetchone()[0]
          orphans = db.execute(
              "SELECT COUNT(*) FROM model_files f "
              "LEFT JOIN models m ON m.id = f.model_id WHERE m.id IS NULL"
          ).fetchone()[0]
          bad = db.execute("SELECT COUNT(*) FROM model_files WHERE length(h) != 32").fetchone()[0]
          print(f"models={models} model_files={files} orphans={orphans} bad_digests={bad}")
          if not models:
              sys.exit("::error::seed.db has no models")
          if orphans:
              sys.exit(f"::error::{orphans} model_files rows reference a missing model")
          if bad:
              sys.exit(f"::error::{bad} model_files rows have a non-32-byte digest")
          PY

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Validate pyproject.toml files
        run: |
          python -c "import tomllib; tomllib.load(open('pyproject.toml', 'rb'))"
          for pkg in packages/*/pyproject.toml; do
            python -c "import tomllib; tomllib.load(open('$pkg', 'rb'))"
          done
      - name: Check required files exist
        run: |
          for file in README.md LICENSE CONTRIBUTING.md; do
            if [ ! -f "$file" ]; then
              echo "Missing required file: $file"
              exit 1
            fi
          done
